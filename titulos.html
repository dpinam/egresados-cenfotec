<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de títulos académicos - Comunidad de Egresados CENFOTEC</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">

    <aside class="menu-lateral" id="barra-lateral"></aside>

    <main class="contenido">
      <div class="barra-superior">
        <div>
          <p class="miga">Inicio / Títulos académicos</p>
          <h1>Gestión de títulos académicos</h1>
        </div>
        <div class="usuario">
          <strong data-usuario-nombre>María Alvarado</strong><br>
          <span class="texto-ayuda" data-usuario-rol>Registro</span>
        </div>
      </div>

      <div id="aviso-titulo" class="aviso"></div>

      <div class="panel solo-admin">
        <h2>Registrar título académico</h2>
        <form action="#" method="post" id="form-titulo" novalidate>
          <div class="fila-formulario">
            <div class="campo">
              <label for="egresado">Egresado <span class="obligatorio">*</span></label>
              <select id="egresado"></select>
            </div>
          </div>
          <div class="fila-formulario">
            <div class="campo">
              <label for="tipo">Tipo de programa <span class="obligatorio">*</span></label>
              <select id="tipo">
                <option>Técnico</option>
                <option>Bachillerato</option>
                <option>Maestría</option>
              </select>
            </div>
            <div class="campo">
              <label for="carrera">Carrera <span class="obligatorio">*</span></label>
              <select id="carrera"></select>
            </div>
          </div>
          <div class="fila-formulario">
            <div class="campo">
              <label for="escuela">Escuela académica <span class="obligatorio">*</span></label>
              <select id="escuela"></select>
            </div>
            <div class="campo">
              <label for="anio">Año de graduación <span class="obligatorio">*</span></label>
              <input type="number" id="anio" placeholder="2026" min="1990" max="2026">
            </div>
          </div>
          <div class="fila-formulario">
            <div class="campo">
              <label for="estado">Estado del título <span class="obligatorio">*</span></label>
              <select id="estado">
                <option>Graduado</option>
                <option>En trámite</option>
                <option>Suspendido</option>
              </select>
            </div>
          </div>
          <div class="acciones-formulario">
            <button type="button" class="boton boton-secundario">Limpiar</button>
            <button type="submit" class="boton">Guardar título</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h2>Títulos registrados</h2>
        <form class="filtros" action="#" method="get" id="filtros-titulos">
          <div class="campo">
            <label for="f-egresado">Egresado</label>
            <input type="text" id="f-egresado" placeholder="Nombre o identificación">
          </div>
          <div class="campo">
            <label for="f-tipo">Tipo de programa</label>
            <select id="f-tipo">
              <option>Todos</option>
              <option>Técnico</option>
              <option>Bachillerato</option>
              <option>Maestría</option>
            </select>
          </div>
          <div class="campo">
            <label for="f-estado">Estado</label>
            <select id="f-estado">
              <option>Todos</option>
              <option>Graduado</option>
              <option>En trámite</option>
              <option>Suspendido</option>
            </select>
          </div>
          <button type="submit" class="boton">Filtrar</button>
        </form>

        <table>
          <thead>
            <tr>
              <th>Egresado</th>
              <th>Tipo</th>
              <th>Carrera</th>
              <th>Escuela</th>
              <th>Año</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-titulos"></tbody>
        </table>
        <p class="texto-ayuda">Un mismo egresado puede tener varios títulos. Los datos se guardan en Local Storage.</p>
      </div>

    </main>
  </div>

  <script src="js/almacenamiento.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/datos-iniciales.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/navegacion.js"></script>
  <script src="js/pagina-titulos.js"></script>
</body>
</html>
